name: IOC Enrichment Catchup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which enrichers to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - domain-vt-only
          - hash-vt-only
          - meta-only
      skip_reset:
        description: "Skip resetting previously-checked-null rows (avoids re-burning quota on confirmed 404s)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IOC enrichment catchup
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          VT_API_KEY_DOMAIN: ${{ secrets.VT_API_KEY_DOMAIN }}
          VT_API_KEY:        ${{ secrets.VT_API_KEY }}
          VT_API_KEY_BACKUP: ${{ secrets.VT_API_KEY_BACKUP }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          FLAGS=""
          if [ "${{ github.event.inputs.skip_reset }}" = "true" ]; then
            FLAGS="--skip-reset"
          fi
          if [ "$MODE" = "domain-vt-only" ]; then
            python catchup_domain_enrichment.py --domain-vt-only $FLAGS
          elif [ "$MODE" = "hash-vt-only" ]; then
            python catchup_domain_enrichment.py --hash-vt-only $FLAGS
          elif [ "$MODE" = "meta-only" ]; then
            python catchup_domain_enrichment.py --meta-only $FLAGS
          else
            python catchup_domain_enrichment.py $FLAGS
          fi

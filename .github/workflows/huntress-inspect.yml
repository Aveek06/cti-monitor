name: Huntress HTML Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scrapling
        run: |
          pip install "scrapling[fetchers]" beautifulsoup4
          scrapling install
          python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'

      - name: Fetch and inspect Huntress page structure
        run: |
          python - <<'EOF'
          from scrapling.fetchers import StealthyFetcher
          from bs4 import BeautifulSoup
          import re, concurrent.futures

          def fetch():
              return StealthyFetcher.fetch(
                  "https://www.huntress.com/blog",
                  headless=True,
                  block_webrtc=True,
                  hide_canvas=True,
                  timeout=60000,
              )

          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as pool:
              page = pool.submit(fetch).result()

          html = page.html_content or ""
          soup = BeautifulSoup(html, "html.parser")

          print(f"=== Total HTML length: {len(html)} chars ===\n")

          # Find all <time> elements
          times = soup.find_all("time")
          print(f"=== <time> elements found: {len(times)} ===")
          for t in times[:10]:
              print(f"  {t}")

          # Find elements with 'date' in class
          date_els = soup.find_all(class_=re.compile(r'date', re.I))
          print(f"\n=== Elements with 'date' in class: {len(date_els)} ===")
          for el in date_els[:10]:
              print(f"  tag={el.name} class={el.get('class')} text={el.get_text(strip=True)[:80]}")

          # Find the blog-hero-card-date span and walk up to its link ancestor
          hero_date = soup.find("span", class_="blog-hero-card-date")
          if hero_date:
              print(f"\n=== Hero date text: {hero_date.get_text(strip=True)} ===")
              # Walk up to find the enclosing <a>
              node = hero_date.parent
              for depth in range(8):
                  if node is None or node.name in ("html", "body"):
                      break
                  if node.name == "a":
                      print(f"  Enclosing <a> at depth {depth}: href={node.get('href')} class={node.get('class')}")
                      print(f"  Full <a> HTML: {str(node)[:600]}")
                      break
                  print(f"  depth {depth}: <{node.name}> class={node.get('class')}")
                  node = node.parent

          # Find ALL blog links (including text-less ones)
          blog_links = [a for a in soup.find_all("a", href=True) if re.search(r'/blog/[^/]+$', a.get("href",""))]
          print(f"\n=== /blog/SLUG links found: {len(blog_links)} unique ===")
          seen = set()
          for a in blog_links:
              href = a['href']
              if href not in seen:
                  seen.add(href)
                  print(f"  href={href}  class={a.get('class','')}")

          EOF

name: C/Side Attacks Category Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scrapling
        run: |
          pip install "scrapling[fetchers]" beautifulsoup4
          scrapling install
          python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'

      - name: Test scrapling_fetcher on attacks category
        run: |
          python - <<'EOF'
          from scrapling.fetchers import Fetcher
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse, urljoin
          import concurrent.futures

          url = "https://cside.com/blog?category=attacks"
          page = Fetcher(auto_match=False).get(url, timeout=20)
          html = page.html_content or ""
          soup = BeautifulSoup(html, "html.parser")

          domain = urlparse(url).netloc
          blog_links = []
          seen = set()
          for a in soup.find_all("a", href=True):
              full = urljoin(url, a["href"])
              p = urlparse(full)
              if p.netloc != domain:
                  continue
              path = p.path
              if not path.startswith("/blog/"):
                  continue
              slug = path.rstrip("/").split("/")[-1]
              if len(slug) < 8:
                  continue
              if full not in seen:
                  seen.add(full)
                  blog_links.append(full)

          print(f"=== scrapling_fetcher: {len(blog_links)} /blog/ links from {url} ===")
          for l in blog_links:
              print(f"  {l}")

          attack_count = sum(1 for l in blog_links if "attack" in l.lower())
          print(f"\n=== Links with 'attack' in URL: {attack_count} / {len(blog_links)} ===")
          if len(blog_links) > 0 and attack_count == len(blog_links):
              print("RESULT: scrapling_fetcher WORKS — all links are attack-category posts")
          elif attack_count > 0:
              print(f"RESULT: PARTIAL — only {attack_count} of {len(blog_links)} are attack posts (category filter may be client-side only)")
          else:
              print("RESULT: FAILED — no blog links found, need StealthyFetcher")
          EOF

      - name: Fallback — test StealthyFetcher if needed
        run: |
          python - <<'EOF'
          from scrapling.fetchers import StealthyFetcher
          from bs4 import BeautifulSoup
          from urllib.parse import urlparse, urljoin
          import concurrent.futures

          url = "https://cside.com/blog?category=attacks"

          def fetch():
              return StealthyFetcher.fetch(url, headless=True, block_webrtc=True, hide_canvas=True, timeout=60000)

          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as pool:
              page = pool.submit(fetch).result()

          html = page.html_content or ""
          soup = BeautifulSoup(html, "html.parser")

          domain = urlparse(url).netloc
          blog_links = []
          seen = set()
          for a in soup.find_all("a", href=True):
              full = urljoin(url, a["href"])
              p = urlparse(full)
              if p.netloc != domain:
                  continue
              path = p.path
              if not path.startswith("/blog/"):
                  continue
              slug = path.rstrip("/").split("/")[-1]
              if len(slug) < 8:
                  continue
              if full not in seen:
                  seen.add(full)
                  blog_links.append(full)

          print(f"=== StealthyFetcher: {len(blog_links)} /blog/ links ===")
          for l in blog_links:
              print(f"  {l}")

          attack_count = sum(1 for l in blog_links if "attack" in l.lower())
          print(f"\n=== Links with 'attack' in URL: {attack_count} / {len(blog_links)} ===")
          EOF

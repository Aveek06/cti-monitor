name: CyberArk HarfangLab Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install beautifulsoup4 "scrapling[fetchers]"
          scrapling install
          python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'
      - name: Inspect CyberArk and HarfangLab
        run: |
          python - <<'EOF'
          from scrapling.fetchers import StealthyFetcher, Fetcher
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          def dump_links(label, url, filter_kw):
              for fetcher_name, fetch_fn in [("Fetcher", lambda: Fetcher().get(url)),
                                             ("StealthyFetcher", lambda: StealthyFetcher().fetch(url))]:
                  print(f"\n=== {label} — {fetcher_name} ===")
                  try:
                      page = fetch_fn()
                      if page and page.status == 200:
                          soup = BeautifulSoup(page.html_content, "html.parser")
                          links = list(dict.fromkeys(
                              urljoin(url, a["href"]) for a in soup.find_all("a", href=True)
                              if filter_kw in a.get("href", "") or filter_kw in urljoin(url, a.get("href", ""))
                          ))
                          print(f"HTTP {page.status} — {len(links)} links")
                          for l in links[:10]: print(f"  {l}")
                      else:
                          print(f"HTTP {page.status if page else 'None'}")
                  except Exception as e:
                      print(f"ERROR: {e}")

          dump_links("CyberArk/PaloAlto identity-security", "https://www.paloaltonetworks.com/blog/identity-security/", "/blog/identity-security/")
          dump_links("HarfangLab /blog/", "https://harfanglab.io/blog/", "/blog/")
          EOF
        timeout-minutes: 3

name: ACSC Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install feedparser requests beautifulsoup4 "scrapling[fetchers]"
          scrapling install
          python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'
      - name: Test ACSC reachability
        run: |
          python - <<'EOF'
          import feedparser, requests
          from scrapling.fetchers import StealthyFetcher
          from bs4 import BeautifulSoup

          target_url = "https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories"
          feed_candidates = [
              "https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/feed",
              "https://www.cyber.gov.au/rss.xml",
              "https://www.cyber.gov.au/feed",
          ]

          print("=== Feed candidates ===")
          for fu in feed_candidates:
              try:
                  d = feedparser.parse(fu)
                  if d.entries:
                      print(f"FEED OK ({len(d.entries)} entries): {fu}")
                      for e in d.entries[:3]:
                          print(f"  {e.get('link','?')} — {e.get('title','?')}")
                  else:
                      print(f"FEED empty/failed (status={d.get('status','?')}): {fu}")
              except Exception as ex:
                  print(f"FEED error: {fu} — {ex}")

          print("\n=== requests GET ===")
          try:
              r = requests.get(target_url, timeout=15, headers={"User-Agent": "Mozilla/5.0"})
              print(f"Status: {r.status_code}, Content-Length: {len(r.content)}")
              soup = BeautifulSoup(r.text, "html.parser")
              links = [a["href"] for a in soup.find_all("a", href=True) if "/alerts-and-advisories/" in a["href"]]
              print(f"Advisory links found: {len(links)}")
              for l in links[:5]:
                  print(f"  {l}")
          except Exception as ex:
              print(f"requests error: {ex}")

          print("\n=== StealthyFetcher ===")
          try:
              fetcher = StealthyFetcher()
              page = fetcher.fetch(target_url)
              if page and page.status == 200:
                  soup = BeautifulSoup(page.html_content, "html.parser")
                  links = [a["href"] for a in soup.find_all("a", href=True) if "/alerts-and-advisories/" in a["href"]]
                  print(f"Status: {page.status}, Advisory links: {len(links)}")
                  for l in links[:5]:
                      print(f"  {l}")
              else:
                  status = page.status if page else "None"
                  print(f"StealthyFetcher status: {status}")
          except Exception as ex:
              print(f"StealthyFetcher error: {ex}")

          EOF

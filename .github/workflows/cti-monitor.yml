name: CTI Monitor

on:
  workflow_dispatch:   # triggered externally by cron-job.org every 8 hours

jobs:
  run-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser requests playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: cti-state-${{ github.run_id }}
          restore-keys: |
            cti-state-

      - name: Run monitor
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run_check.py config.json state.json

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: cti-state-${{ github.run_id }}

name: CTI Monitor

on:
  workflow_dispatch:   # triggered externally by cron-job.org once daily at 16:00 UTC (21:30 IST)
    inputs:
      force_weekly:
        description: "Send weekly report regardless of day/time"
        required: false
        default: "false"
        type: string
  schedule:
    - cron: "0  4 * * *"   # fallback: fires 4h after cron-job.org 00:00 UTC (5:30 AM IST) if missed
    - cron: "0 12 * * *"   # fallback: fires 4h after cron-job.org 08:00 UTC (1:30 PM IST) if missed
    - cron: "0 20 * * *"   # fallback: fires 4h after cron-job.org 16:00 UTC (9:30 PM IST) if missed

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether schedule fallback should proceed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Triggered by workflow_dispatch (cron-job.org) — proceeding."
          else
            LAST=$(gh api "repos/${{ github.repository }}/actions/runs?event=workflow_dispatch&status=success&per_page=1" \
              --jq '.workflow_runs[0].created_at // empty')
            if [ -z "$LAST" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "No prior workflow_dispatch found — schedule fallback proceeding."
            else
              LAST_TS=$(date -d "$LAST" +%s)
              NOW=$(date +%s)
              AGO=$(( (NOW - LAST_TS) / 3600 ))
              echo "Last workflow_dispatch was ${AGO}h ago."
              if [ "$AGO" -lt 9 ]; then
                echo "should_run=false" >> $GITHUB_OUTPUT
                echo "cron-job.org ran ${AGO}h ago — schedule fallback skipping."
              else
                echo "should_run=true" >> $GITHUB_OUTPUT
                echo "No recent workflow_dispatch (${AGO}h ago) — schedule fallback proceeding."
              fi
            fi
          fi

  run-check:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser requests playwright beautifulsoup4 crawl4ai "scrapling[fetchers]" anthropic psycopg2-binary htmldate iocsearcher openpyxl
          playwright install chromium
          crawl4ai-setup
          scrapling install
          python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state.json
            last_active.json
            prev_run_links.json
            ioc_export.json
            ttp_export.json
            sigma_export.json
            .tranco_cache.txt
          key: cti-state-${{ github.run_id }}
          restore-keys: |
            cti-state-

      - name: Apply seed data for new/empty sites
        run: |
          python -c '
          import json, os
          if not os.path.exists("state_seeds.json"):
              exit()
          seed_data = json.load(open("state_seeds.json"))
          state = json.load(open("state.json")) if os.path.exists("state.json") else {}
          force = seed_data.pop("_force_replace", [])
          changed = 0
          for name, links in seed_data.items():
              if (not state.get(name) or name in force) and links:
                  state[name] = links
                  changed += 1
                  print(f"Seeded {name}: {len(links)} links")
          if changed:
              json.dump(state, open("state.json", "w"), indent=2)
              print(f"Patched {changed} sites into state.json")
          '

      - name: Run monitor
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VT_API_KEY:        ${{ secrets.VT_API_KEY }}
          VT_API_KEY_DOMAIN: ${{ secrets.VT_API_KEY_DOMAIN }}
          SHODAN_API_KEY:    ${{ secrets.SHODAN_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          GREYNOISE_API_KEY: ${{ secrets.GREYNOISE_API_KEY }}
          IPINFO_TOKEN:      ${{ secrets.IPINFO_TOKEN }}
          URLHAUS_API_KEY:   ${{ secrets.URLHAUS_API_KEY }}
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
        run: python run_check.py config.json state.json last_active.json prev_run_links.json

      - name: Send weekly stale-sites report
        if: success()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
        run: |
          HOUR=$(date +%H)
          FORCE="${{ github.event.inputs.force_weekly }}"
          if [ "$FORCE" = "true" ] || { [ "$(date +%u)" = "5" ] && [ "$HOUR" -ge 16 ] && [ "$HOUR" -le 20 ]; }; then
            echo "Running weekly stale-sites report (force=${FORCE}, day=$(date +%u), hour=${HOUR})."
            python weekly_report.py config.json last_active.json ioc_export.json
          else
            echo "Outside weekly report window (day $(date +%u), hour ${HOUR}) — skipping."
          fi

      - name: Upload state as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cti-state-${{ github.run_id }}
          path: |
            state.json
            last_active.json
            prev_run_links.json
            ioc_export.json
            ttp_export.json
            sigma_export.json
          retention-days: 7

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            last_active.json
            prev_run_links.json
            ioc_export.json
            ttp_export.json
            sigma_export.json
            .tranco_cache.txt
          key: cti-state-${{ github.run_id }}

name: CTI Monitor

on:
  workflow_dispatch:   # triggered externally by cron-job.org every 8 hours

jobs:
  run-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser requests playwright beautifulsoup4 crawl4ai "scrapling[fetchers]"
          playwright install chromium
          playwright install-deps chromium
          crawl4ai-setup
          scrapling install
          python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state.json
            last_active.json
          key: cti-state-${{ github.run_id }}
          restore-keys: |
            cti-state-

      - name: Apply seed data for new/empty sites
        run: |
          python -c '
          import json, os
          if not os.path.exists("state_seeds.json"):
              exit()
          seed_data = json.load(open("state_seeds.json"))
          state = json.load(open("state.json")) if os.path.exists("state.json") else {}
          force = seed_data.pop("_force_replace", [])
          changed = 0
          for name, links in seed_data.items():
              if (not state.get(name) or name in force) and links:
                  state[name] = links
                  changed += 1
                  print(f"Seeded {name}: {len(links)} links")
          if changed:
              json.dump(state, open("state.json", "w"), indent=2)
              print(f"Patched {changed} sites into state.json")
          '

      - name: Run monitor
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run_check.py config.json state.json last_active.json

      - name: Send weekly stale-sites report
        if: success()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "$(date +%u)" = "5" ]; then
            echo "Friday detected — running weekly stale-sites report."
            python weekly_report.py config.json last_active.json
          else
            echo "Not Friday (day $(date +%u)) — skipping weekly stale-sites report."
          fi

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            last_active.json
          key: cti-state-${{ github.run_id }}

name: URL Exact Check (one-shot, delete after use)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            last_active.json
            prev_run_links.json
          key: cti-state-${{ github.run_id }}
          restore-keys: |
            cti-state-

      - name: Check exact URLs in state
        run: |
          python3 - << 'PYEOF'
          import json, sys

          urls_to_check = [
              ("Netskope",               "https://www.netskope.com/blog/developers-in-the-crosshairs-fake-ai-tools-deliver-infostealer"),
              ("PolySwarm",              "https://blog.polyswarm.io/clickfix-themed-campaign-deploys-starland-rat-and-wldr-framework"),
              ("CloudSEK",               "https://www.cloudsek.com/blog/access-for-sale-inside-a-russian-speaking-access-brokers-dual-operation"),
              ("Zscaler",                "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"),
              ("SecureList - Kaspersky", "https://securelist.com/incidents-at-brazilian-educational-institutions/120803/"),
              ("Datadog Security Labs",  "https://securitylabs.datadoghq.com/articles/coding-agent-project-trust-code-execution-before-first-prompt/"),
              ("ASEC",                   "https://asec.ahnlab.com/en/94786/"),
              ("Unit 42- Palo Alto Networks", "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/"),
          ]

          try:
              state = json.load(open("state.json"))
          except FileNotFoundError:
              print("ERROR: state.json not found - cache restore may have failed")
              sys.exit(1)

          print("=== EXACT URL MATCH IN state.json ===")
          for site, url in urls_to_check:
              site_urls = state.get(site, [])
              found = url in site_urls
              status = "IN STATE (was reported)" if found else "NOT IN STATE (was NOT reported)"
              print(f"  {'YES' if found else 'NO ':3} | {site:35} | {status}")
              print(f"       URL: {url}")
          PYEOF

          key: cti-state-30674427704
          restore-keys: cti-state-30674427704
      - run: python3 -c "import json; a=json.load(open('all_new.json')); b=json.load(open('prev_run_links.json')) if __import__('os').path.exists('prev_run_links.json') else []; json.dump(list(set(a+b)),open('all_new.json','w'))"


name: State Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state.json
            last_active.json
            prev_run_links.json
          key: cti-state-${{ github.run_id }}
          restore-keys: |
            cti-state-
      - name: Check URLs in state
        run: |
          python3 - <<'EOF'
          import json, os

          if not os.path.exists("state.json"):
              print("state.json not found in cache")
              exit(1)

          with open("state.json") as f:
              state = json.load(f)

          all_urls = set()
          for links in state.values():
              if isinstance(links, list):
                  all_urls.update(links)

          print(f"State has {len(state)} sites, {len(all_urls)} total URLs\n")

          urls = [
              "https://www.sophos.com/en-gb/blog/2608-volatility-interlock",
              "https://www.microsoft.com/en-us/security/blog/2026/08/04/chaindrop-supply-chain-compromise-anatomy-self-propagating-worm/",
              "https://x.com/msftsecintel/status/2084642457048752134",
              "https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant",
              "https://thehackernews.com/2026/08/quickfox-supply-chain-attack-delivers.html",
              "https://www.securonix.com/blog/smoke-screen-screenconnect-rmm-abuse-cloudflare-tunnels/",
              "https://www.netskope.com/blog/npm-stealer-reads-its-c2-from-an-ethereum-contract",
              "https://www.huntress.com/blog/bank-spam-rmm",
              "https://hunt.io/blog/the-gentlemen-etherrat-ethereum-smart-contract-c2",
              "https://zerobec.com/blog/greatness-phaas-aitm-and-device-code-phishing",
              "https://thehackernews.com/2026/08/greatness-phaas-adds-device-code.html",
              "https://www.bleepingcomputer.com/news/security/phishing-service-spoofs-ringcentral-to-steal-microsoft-365-accounts/",
              "https://www.forescout.com/blog/new-tp-link-router-vulnerabilities-exploiting-zero-touch-provisioning/",
              "https://www.bleepingcomputer.com/news/security/tp-link-patches-omada-ztp-flaws-allowing-hackers-to-breach-networks/",
              "https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing",
              "https://www.bleepingcomputer.com/news/security/openai-anthropic-ai-agents-targeted-real-people-and-systems-in-cyber-tests/",
              "https://www.netskope.com/blog/fake-captcha-real-business-traffic-distribution-for-hire",
              "https://x.com/IntCyberDigest/status/2084636007790449126",
              "https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack",
              "https://www.bleepingcomputer.com/news/security/massive-chaindrop-npm-supply-chain-attack-infects-hundreds-of-packages/",
              "https://www.manifold.security/blog/open-vsx-evil-twin-extensions",
              "https://thehackernews.com/2026/08/open-vsx-removes-77-malicious-evil-twin.html",
          ]

          found, missing = [], []
          for u in urls:
              if u in all_urls:
                  found.append(u)
              else:
                  missing.append(u)

          print(f"=== ALREADY IN STATE ({len(found)}) ===")
          for u in found:
              print(f"  YES  {u}")

          print(f"\n=== NOT IN STATE ({len(missing)}) ===")
          for u in missing:
              print(f"  NO   {u}")
          EOF

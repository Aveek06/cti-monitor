name: Keepalive

on:
  schedule:
    - cron: "0 12 1 * *"   # 1st of every month at noon UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep workflows active
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: 45   # trigger if no commit in 45 days

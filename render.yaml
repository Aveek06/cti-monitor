services:
  - type: cron
    name: cti-monitor-backup
    runtime: python
    schedule: "0 4,12,20 * * *"   # 04:00, 12:00, 20:00 UTC (every 8h) — adjust as needed
    buildCommand: |
      pip install feedparser requests playwright beautifulsoup4 crawl4ai "scrapling[fetchers]" anthropic psycopg2-binary htmldate iocsearcher openpyxl
      playwright install --with-deps chromium
      crawl4ai-setup
      scrapling install
      python -c 'import pathlib,sys;[p.write_text(p.read_text().replace("chromium_version = 149","chromium_version = 130").replace("chrome_version = 149","chrome_version = 130")) for p in pathlib.Path(sys.prefix).rglob("scrapling/engines/toolbelt/fingerprints.py")]'
    startCommand: bash render_run.sh
    envVars:
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN   # Personal Access Token with repo scope — NOT the Actions token
        sync: false

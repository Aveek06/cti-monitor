<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CTI Source Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; border: none; background: none; cursor: pointer; }

    /* ── Design tokens ──────────────────────────────────────────────────── */
    :root {
      --canvas:       #F9FAFB;   /* warm off-white background */
      --white:        #FFFFFF;   /* card surfaces */
      --text:         #18181B;   /* zinc-900 primary text */
      --dim:          #71717A;   /* zinc-500 secondary */
      --muted:        #94A3B8;   /* slate-400 tertiary */
      --border:       rgba(226,232,240,0.85);
      --hover:        #F4F4F5;
      --amber:        #D97706;   /* amber-600 warning */
      --amber-lt:     #FDE68A;   /* amber-200 for inverted bg */
      --amber-bg:     #FFFBEB;
      --amber-bd:     rgba(253,230,138,0.9);
      --shadow:       0 20px 40px -15px rgba(0,0,0,0.05);
      --shadow-hover: 0 8px 24px -4px rgba(0,0,0,0.09), 0 2px 6px -2px rgba(0,0,0,0.04);
      --ease:         cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer:  cubic-bezier(0.32, 0.72, 0, 1);
      --r:            12px;
      --r-sm:         6px;
    }

    /* ── Base ───────────────────────────────────────────────────────────── */
    body {
      background: var(--canvas);
      color: var(--text);
      font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    /* Subtle ambient gradient — security-green tint at top */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(16,185,129,0.05), transparent 65%);
    }

    #app { position: relative; z-index: 1; }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Loading ────────────────────────────────────────────────────────── */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 100dvh;
      color: var(--dim);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--dim);
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ──────────────────────────────────────────────────────────── */
    #view-error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 10px;
      padding: 40px 24px;
      text-align: center;
    }

    .err-title { font-size: 15px; font-weight: 500; }
    .err-body  { font-size: 13px; color: var(--dim); max-width: 400px; line-height: 1.65; }

    /* ── Dashboard ──────────────────────────────────────────────────────── */
    #view-dashboard { display: none; }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 64px 0 36px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .header-sub {
      font-size: 13px;
      color: var(--dim);
      margin-top: 5px;
    }

    .header-updated {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
      padding-top: 3px;
      white-space: nowrap;
    }

    /* Stat cards */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding-bottom: 10px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px 20px 18px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      box-shadow: var(--shadow);
      transition:
        background   0.18s var(--ease),
        border-color 0.18s var(--ease),
        transform    0.22s var(--ease),
        box-shadow   0.22s var(--ease),
        color        0.18s var(--ease);
    }

    button.stat-card:hover {
      background: var(--hover);
      border-color: rgba(212,212,216,0.9);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    button.stat-card:active { transform: translateY(-1px) scale(0.99); }

    /* Inverted (selected) state */
    button.stat-card[aria-expanded="true"] {
      background: var(--text);
      border-color: var(--text);
      color: rgba(255,255,255,0.9);
      transform: none;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18);
    }

    .stat-num {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 32px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      transition: color 0.18s var(--ease);
    }

    button.stat-card[aria-expanded="true"] .stat-num { color: rgba(255,255,255,0.95); }

    .stat-num.amber { color: var(--amber); }
    button.stat-card[aria-expanded="true"] .stat-num.amber { color: var(--amber-lt); }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--dim);
      letter-spacing: 0.01em;
      transition: color 0.18s var(--ease);
    }

    button.stat-card[aria-expanded="true"] .stat-label { color: rgba(255,255,255,0.5); }

    .stat-arrow {
      position: absolute;
      top: 18px;
      right: 16px;
      font-size: 16px;
      color: var(--muted);
      line-height: 1;
      pointer-events: none;
      transition: transform 0.3s var(--ease), color 0.18s var(--ease);
    }

    button.stat-card[aria-expanded="true"] .stat-arrow {
      transform: rotate(180deg);
      color: rgba(255,255,255,0.35);
    }

    /* Panels — CSS grid accordion */
    .panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s var(--ease);
    }

    .panel.open { grid-template-rows: 1fr; }

    .panel-inner { overflow: hidden; }

    .panel-content {
      margin-top: 8px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      max-height: 520px;
      overflow-y: auto;
      box-shadow: var(--shadow);
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.1) transparent;
    }

    .panel-content::-webkit-scrollbar { width: 4px; }
    .panel-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

    /* Site rows */
    .site-row {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s ease;
      opacity: 0; /* rows start invisible; animation brings them in */
    }

    .site-row:last-of-type { border-bottom: none; }
    .site-row:hover { background: var(--canvas); }

    /* Stagger entrance when panel opens */
    .panel-entering .site-row {
      animation: rowIn 0.35s var(--ease) calc(var(--i, 0) * 55ms) both;
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .site-name {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Proportional bar */
    .bar-wrap { display: flex; align-items: center; gap: 8px; }

    .bar-track {
      width: 72px;
      height: 3px;
      background: #E4E4E7;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--text);
      border-radius: 2px;
      transition: width 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .count-val {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--dim);
      min-width: 20px;
      text-align: right;
    }

    /* Badges */
    .badge {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .badge-amber {
      color: var(--amber);
      background: var(--amber-bg);
      border: 1px solid var(--amber-bd);
    }

    .last-date {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .chevron {
      color: var(--muted);
      font-size: 14px;
      transition: transform 0.15s var(--ease), color 0.1s ease;
    }

    .site-row:hover .chevron { transform: translateX(2px); color: var(--dim); }

    /* Panel footer label (total count when list is long) */
    .panel-footer {
      padding: 10px 18px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--canvas);
      text-align: center;
    }

    /* Page footer */
    .page-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 28px 0 56px;
      margin-top: 28px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }

    /* ── Drawer ─────────────────────────────────────────────────────────── */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24,24,27,0.22);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 40;
    }

    .backdrop.visible { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(460px, 92vw);
      height: 100%;
      background: var(--white);
      border-left: 1px solid var(--border);
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.38s var(--ease-drawer);
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 40px rgba(0,0,0,0.06);
    }

    .drawer.open { transform: translateX(0); }

    .drawer-hd {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-shrink: 0;
    }

    .drawer-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .drawer-domain {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      margin-top: 3px;
      transition: color 0.1s ease;
    }

    .drawer-domain:hover { color: var(--dim); }

    .drawer-close {
      width: 28px;
      height: 28px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--canvas);
      font-size: 16px;
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .drawer-close:hover { background: var(--hover); color: var(--text); }

    .drawer-stats {
      display: flex;
      gap: 20px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--canvas);
      flex-shrink: 0;
    }

    .d-stat-num {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .d-stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.1) transparent;
    }

    .drawer-body::-webkit-scrollbar { width: 4px; }
    .drawer-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

    .links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .link-item { opacity: 0; }

    .link-item.show {
      animation: linkIn 0.28s var(--ease) both;
    }

    @keyframes linkIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .link-item a {
      display: block;
      padding: 9px 10px;
      border-radius: var(--r-sm);
      text-decoration: none;
      transition: background 0.1s ease;
    }

    .link-item a:hover { background: var(--canvas); }

    .link-slug {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    .link-url {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
      word-break: break-all;
    }

    .no-links {
      padding: 20px 10px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
      .header { flex-direction: column; gap: 8px; padding: 40px 0 28px; }
      .header-updated { text-align: left; }
      .bar-track { width: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, .panel, .drawer, .stat-card { transition: none !important; animation: none !important; }
      .site-row { opacity: 1 !important; }
      .link-item { opacity: 1 !important; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Loading -->
  <div id="view-loading">
    <div class="spinner"></div>
    <p style="font-size:13px;color:var(--dim)">Loading sources&hellip;</p>
  </div>

  <!-- Error -->
  <div id="view-error">
    <p class="err-title">Failed to load</p>
    <p class="err-body" id="err-msg"></p>
  </div>

  <!-- Dashboard -->
  <div id="view-dashboard">
    <div class="container">

      <header class="header">
        <div>
          <h1>CTI Source Monitor</h1>
          <p class="header-sub">Security blog activity &middot; <span id="hdr-total">—</span> sources tracked</p>
        </div>
        <div class="header-updated" id="hdr-updated"></div>
      </header>

      <!-- Stat cards -->
      <div class="stats">
        <button class="stat-card" id="card-active" aria-expanded="false">
          <span class="stat-num" id="num-active">—</span>
          <span class="stat-label">Active Sources</span>
          <span class="stat-arrow">↓</span>
        </button>
        <button class="stat-card" id="card-quiet" aria-expanded="false">
          <span class="stat-num amber" id="num-quiet">—</span>
          <span class="stat-label">Quiet Sites</span>
          <span class="stat-arrow">↓</span>
        </button>
        <div class="stat-card">
          <span class="stat-num" id="num-links">—</span>
          <span class="stat-label">Links This Week</span>
        </div>
      </div>

      <!-- Active sources panel -->
      <div class="panel" id="panel-active">
        <div class="panel-inner">
          <div class="panel-content" id="content-active"></div>
        </div>
      </div>

      <!-- Quiet sites panel -->
      <div class="panel" id="panel-quiet">
        <div class="panel-inner">
          <div class="panel-content" id="content-quiet"></div>
        </div>
      </div>

      <footer class="page-footer">
        <span>CTI Source Monitor &middot; Runs daily 21:30 IST &middot; Auto-refreshes every 8 hours</span>
        <span id="footer-date"></span>
      </footer>

    </div>
  </div>

</div>

<!-- Drawer overlay -->
<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-name">
  <div class="drawer-hd">
    <div>
      <div class="drawer-name" id="drawer-name"></div>
      <a class="drawer-domain" id="drawer-domain" href="#" target="_blank" rel="noopener noreferrer">
        <span id="drawer-domain-txt"></span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M3.5 2H2C1.45 2 1 2.45 1 3V8C1 8.55 1.45 9 2 9H7C7.55 9 8 8.55 8 8V6.5M6 1H9M9 1V4M9 1L4.5 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
    <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="drawer-stats">
    <div>
      <div class="d-stat-num" id="d-total">—</div>
      <div class="d-stat-label">total captured</div>
    </div>
    <div>
      <div class="d-stat-num" id="d-week">—</div>
      <div class="d-stat-label">this week</div>
    </div>
  </div>
  <div class="drawer-body">
    <ul class="links-list" id="links-list"></ul>
  </div>
</div>

<script>
/* ── Constants ─────────────────────────────────────────────────────────────── */
const STALE_DAYS      = 7;
const SKIP_TYPES      = new Set(["skip", "html_TODO"]);
const REFRESH_MS      = 8 * 60 * 60 * 1000; // 8 hours — matches workflow cadence
let   lastUpdatedAt   = null;

/* ── Utilities ─────────────────────────────────────────────────────────────── */
function daysSince(iso) {
  if (!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso)) / 86_400_000);
}

function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("en-GB", {
    day: "2-digit", month: "short", year: "numeric",
  });
}

function relTime(iso) {
  const d = daysSince(iso);
  if (!isFinite(d)) return "";
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 30)  return `${d}d ago`;
  return fmtDate(iso);
}

function urlToSlug(href) {
  try {
    const parts = new URL(href).pathname.split("/").filter(Boolean);
    const slug  = parts[parts.length - 1] || href;
    return slug.replace(/-|_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  } catch { return href; }
}

/* ── Load & derive ─────────────────────────────────────────────────────────── */
async function loadData() {
  const res = await fetch("/api/data");
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `HTTP ${res.status}`);
  }
  return res.json();
}

function derive({ config, state, lastActive, updatedAt }) {
  const cutoff     = new Date(Date.now() - STALE_DAYS * 86_400_000);
  const cutoffStr  = cutoff.toISOString().slice(0, 10);
  const failing    = new Set(lastActive._currently_failing || []);
  const sevenDay   = lastActive._seven_day_counts || {};
  const sites      = (config.sites || []).filter(s => !SKIP_TYPES.has(s.type));
  const activeSites = [], quietSites = [];

  for (const site of sites) {
    const name   = site.name;
    const counts = sevenDay[name] || {};
    const week7  = Object.entries(counts)
      .filter(([d]) => d >= cutoffStr)
      .reduce((sum, [, v]) => sum + v, 0);
    const lastTs = lastActive[name];
    const days   = daysSince(lastTs);

    if (week7 > 0) {
      activeSites.push({ name, url: site.url, count: week7 });
    } else if (!failing.has(name) && lastTs && days >= STALE_DAYS) {
      quietSites.push({ name, url: site.url, lastActive: lastTs, days });
    }
  }

  activeSites.sort((a, b) => b.count - a.count);
  quietSites.sort((a, b) => b.days - a.days);
  const weekTotal = activeSites.reduce((s, x) => s + x.count, 0);

  return { sites, activeSites, quietSites, weekTotal, state, updatedAt };
}

/* ── Render ────────────────────────────────────────────────────────────────── */
function renderActive(sites, state) {
  const max = sites[0]?.count || 1;
  const el  = document.getElementById("content-active");

  el.innerHTML = sites.map((s, i) => {
    const pct = Math.round((s.count / max) * 100);
    return `<div class="site-row" data-name="${esc(s.name)}" style="--i:${Math.min(i, 9)}">
      <span class="site-name">${s.name}</span>
      <div class="site-meta">
        <div class="bar-wrap">
          <div class="bar-track"><div class="bar-fill" data-w="${pct}%"></div></div>
          <span class="count-val">${s.count}</span>
        </div>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }).join("") + (sites.length > 12
    ? `<div class="panel-footer">${sites.length} sources reporting</div>` : "");

  el.querySelectorAll(".site-row").forEach(row =>
    row.addEventListener("click", () => openDrawer(row.dataset.name, sites, state))
  );
}

function renderQuiet(sites, state) {
  const el = document.getElementById("content-quiet");

  el.innerHTML = sites.map((s, i) => `
    <div class="site-row" data-name="${esc(s.name)}" style="--i:${Math.min(i, 9)}">
      <span class="site-name">${s.name}</span>
      <div class="site-meta">
        <span class="last-date">${fmtDate(s.lastActive)}</span>
        <span class="badge badge-amber">${s.days}d quiet</span>
        <span class="chevron">›</span>
      </div>
    </div>`).join("") + (sites.length > 8
    ? `<div class="panel-footer">${sites.length} quiet sites total</div>` : "");

  el.querySelectorAll(".site-row").forEach(row =>
    row.addEventListener("click", () => openDrawer(row.dataset.name, sites, state))
  );
}

function esc(s) { return s.replace(/"/g, "&quot;"); }

/* ── Panel toggle ──────────────────────────────────────────────────────────── */
function togglePanel(cardId, panelId) {
  const card  = document.getElementById(cardId);
  const panel = document.getElementById(panelId);
  const isOpen = panel.classList.contains("open");

  // Collapse all first
  ["panel-active", "panel-quiet"].forEach(id => {
    const p = document.getElementById(id);
    p.classList.remove("open");
    // Reset bars for next animation
    setTimeout(() => p.querySelectorAll(".bar-fill").forEach(b => b.style.width = "0%"), 400);
  });
  ["card-active", "card-quiet"].forEach(id =>
    document.getElementById(id).setAttribute("aria-expanded", "false")
  );

  if (!isOpen) {
    panel.classList.add("open");
    card.setAttribute("aria-expanded", "true");

    // Trigger stagger entrance
    const content = panel.querySelector(".panel-content");
    content.classList.remove("panel-entering");
    void content.offsetHeight; // Force reflow to restart animation
    content.classList.add("panel-entering");

    // Animate bars after panel begins opening
    setTimeout(() => {
      panel.querySelectorAll(".bar-fill").forEach(b => b.style.width = b.dataset.w);
    }, 120);

    // Scroll panel into view
    setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 60);
  }
}

/* ── Drawer ────────────────────────────────────────────────────────────────── */
function openDrawer(name, sites, state) {
  const site  = sites.find(s => s.name === name);
  const links = (state[name] || []).slice().reverse(); // newest first

  document.getElementById("drawer-name").textContent = name;

  const domainEl  = document.getElementById("drawer-domain");
  const domainTxt = document.getElementById("drawer-domain-txt");
  if (site?.url) {
    try {
      domainTxt.textContent = new URL(site.url).hostname;
      domainEl.href = site.url;
    } catch { domainTxt.textContent = ""; }
  } else {
    domainTxt.textContent = "";
  }

  document.getElementById("d-total").textContent = links.length.toLocaleString();
  document.getElementById("d-week").textContent  = site?.count ? site.count : "—";

  const list = document.getElementById("links-list");
  if (links.length === 0) {
    list.innerHTML = `<li class="no-links">No links captured yet.</li>`;
  } else {
    list.innerHTML = links.map((href, i) => `
      <li class="link-item" style="animation-delay:${Math.min(i * 35, 420)}ms">
        <a href="${href}" target="_blank" rel="noopener noreferrer">
          <div class="link-slug">${urlToSlug(href)}</div>
          <div class="link-url">${href}</div>
        </a>
      </li>`).join("");
  }

  document.getElementById("drawer").classList.add("open");
  document.getElementById("backdrop").classList.add("visible");
  document.body.style.overflow = "hidden";

  // Stagger link items in
  requestAnimationFrame(() =>
    list.querySelectorAll(".link-item").forEach(li => li.classList.add("show"))
  );
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("backdrop").classList.remove("visible");
  document.body.style.overflow = "";
  // Reset items so animation replays on next open
  setTimeout(() =>
    document.querySelectorAll(".link-item").forEach(li => li.classList.remove("show")),
    400
  );
}

/* ── Update dashboard (called on init and on background refresh) ────────────── */
function updateDashboard({ sites, activeSites, quietSites, weekTotal, state, updatedAt }) {
  document.getElementById("hdr-total").textContent   = sites.length;
  document.getElementById("num-active").textContent  = activeSites.length;
  document.getElementById("num-quiet").textContent   = quietSites.length;
  document.getElementById("num-links").textContent   = weekTotal.toLocaleString();
  document.getElementById("hdr-updated").textContent = updatedAt ? `Updated ${relTime(updatedAt)}` : "";
  document.getElementById("footer-date").textContent = updatedAt ? fmtDate(updatedAt) : "";
  renderActive(activeSites, state);
  renderQuiet(quietSites, state);
}

/* Brief "↺ Refreshed" flash on the timestamp label */
function flashUpdated(updatedAt) {
  const el   = document.getElementById("hdr-updated");
  const next = updatedAt ? `Updated ${relTime(updatedAt)}` : "";
  el.textContent = "↺ Refreshed";
  el.style.color = "var(--text)";
  setTimeout(() => { el.textContent = next; el.style.color = ""; }, 2200);
}

/* Silently collapse panels and close drawer before re-rendering */
function resetUI() {
  closeDrawer();
  ["panel-active", "panel-quiet"].forEach(id => {
    const p = document.getElementById(id);
    p.classList.remove("open");
    p.querySelectorAll(".bar-fill").forEach(b => b.style.width = "0%");
  });
  ["card-active", "card-quiet"].forEach(id =>
    document.getElementById(id).setAttribute("aria-expanded", "false")
  );
}

/* ── Background refresh ────────────────────────────────────────────────────── */
async function refreshData() {
  try {
    const raw = await loadData();
    if (raw.updatedAt === lastUpdatedAt) return; // no change — skip re-render
    lastUpdatedAt = raw.updatedAt;
    resetUI();
    updateDashboard(derive(raw));
    flashUpdated(raw.updatedAt);
  } catch (err) {
    console.warn("Background refresh failed:", err.message);
  }
}

/* ── Init ──────────────────────────────────────────────────────────────────── */
async function init() {
  try {
    const raw = await loadData();
    lastUpdatedAt = raw.updatedAt;
    updateDashboard(derive(raw));

    document.getElementById("card-active")
      .addEventListener("click", () => togglePanel("card-active", "panel-active"));
    document.getElementById("card-quiet")
      .addEventListener("click", () => togglePanel("card-quiet", "panel-quiet"));

    document.getElementById("drawer-close").addEventListener("click", closeDrawer);
    document.getElementById("backdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

    document.getElementById("view-loading").style.display = "none";
    document.getElementById("view-dashboard").style.display = "block";

    // Re-fetch every 8 hours; re-renders only when updatedAt changes
    setInterval(refreshData, REFRESH_MS);

  } catch (err) {
    document.getElementById("view-loading").style.display = "none";
    document.getElementById("err-msg").textContent = err.message;
    document.getElementById("view-error").style.display = "flex";
  }
}

init();
</script>

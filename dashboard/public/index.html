<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CTI Source Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font: inherit; border: none; background: none; cursor: pointer; }
    a { color: inherit; }

    /* ── Design tokens ──────────────────────────────────────────────────── */
    :root {
      --bg:          #080808;
      --surface:     #0D0D0D;
      --surface2:    #151515;
      --surface3:    #1C1C1C;
      --border:      #202020;
      --border-hi:   #383838;
      --text:        #C8C8C8;
      --text-hi:     #E8E8E8;
      --text-dim:    #555555;
      --text-muted:  #333333;
      --green:       #4AF626;
      --green-dim:   rgba(74,246,38,0.08);
      --green-glow:  rgba(74,246,38,0.18);
      --green-ring:  rgba(74,246,38,0.35);
      --amber:       #FF9500;
      --amber-dim:   rgba(255,149,0,0.08);
      --amber-glow:  rgba(255,149,0,0.18);
      --amber-ring:  rgba(255,149,0,0.35);
      --red:         #FF3B30;
      --red-dim:     rgba(255,59,48,0.08);
      --red-glow:    rgba(255,59,48,0.18);
      --red-ring:    rgba(255,59,48,0.35);
      --ease:        cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* ── Base ───────────────────────────────────────────────────────────── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, monospace;
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse 60% 35% at 50% -5%, rgba(74,246,38,0.04), transparent 65%);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.05) 3px,
        rgba(0,0,0,0.05) 4px
      );
    }

    #app { position: relative; z-index: 1; }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ── Loading ────────────────────────────────────────────────────────── */
    #view-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 100dvh;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 1px solid var(--border-hi);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      box-shadow: 0 0 6px var(--green-glow);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ──────────────────────────────────────────────────────────── */
    #view-error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 10px;
      padding: 40px 28px;
      text-align: center;
    }

    .err-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
    }

    .err-body {
      font-size: 11px;
      color: var(--text-dim);
      max-width: 420px;
      line-height: 1.8;
      letter-spacing: 0.04em;
    }

    /* ── Dashboard ──────────────────────────────────────────────────────── */
    #view-dashboard { display: none; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding: 60px 0 32px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-hi);
      line-height: 1.2;
    }

    .cursor {
      color: var(--green);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .header-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 4px var(--green); opacity: 1; }
      50%      { box-shadow: 0 0 10px var(--green); opacity: 0.7; }
    }

    .header-right {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: right;
      flex-shrink: 0;
      padding-top: 4px;
      line-height: 1.8;
    }

    .header-right span { display: block; }

    .refresh-btn {
      display: block;
      margin-top: 4px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--green);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-align: right;
      transition: opacity 0.15s ease;
      text-shadow: 0 0 6px var(--green-glow);
    }

    .refresh-btn:hover  { opacity: 0.75; }
    .refresh-btn:active { opacity: 0.5; }
    .refresh-btn:disabled { opacity: 0.35; cursor: default; }

    /* ── Sparkline strip ────────────────────────────────────────────────── */
    .sparkline-strip {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      padding: 0 0 20px;
      border-bottom: 1px solid var(--border);
    }

    .spark-meta {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 20px;
      min-width: 80px;
    }

    .spark-label {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .spark-total {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--text-hi);
    }

    .spark-bars {
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 52px;
    }

    .spark-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      height: 100%;
      cursor: default;
      position: relative;
    }

    /* Custom tooltip */
    .spark-col::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: var(--surface3);
      border: 1px solid var(--border-hi);
      color: var(--text-hi);
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 5px 10px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      z-index: 20;
    }

    .spark-col:first-child::after { left: 0;    transform: translateY(5px); }
    .spark-col:last-child::after  { left: auto; right: 0; transform: translateY(5px); }

    .spark-col:hover::after             { opacity: 1; transform: translateX(-50%) translateY(0); }
    .spark-col:first-child:hover::after { opacity: 1; transform: translateY(0); }
    .spark-col:last-child:hover::after  { opacity: 1; transform: translateY(0); }

    .spark-col:hover .spark-fill {
      background: #7DFF52;
      box-shadow: 0 0 14px rgba(74,246,38,0.65);
    }

    .spark-bar-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      background: var(--surface2);
      min-height: 2px;
    }

    .spark-fill {
      width: 100%;
      height: 0%;
      background: var(--green);
      transition: height 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.12s ease,
                  box-shadow 0.12s ease;
      min-height: 2px;
    }

    .spark-fill.has-data {
      box-shadow: 0 0 4px rgba(74,246,38,0.3);
    }

    .spark-day {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Stat cards ─────────────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 20px 0 8px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 18px 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition:
        background  0.15s var(--ease),
        border-color 0.15s var(--ease),
        box-shadow  0.2s var(--ease),
        transform   0.2s var(--ease);
    }

    button.stat-card:hover {
      background: var(--surface2);
      border-color: var(--border-hi);
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px var(--border-hi), 0 8px 24px rgba(0,0,0,0.4);
    }

    button.stat-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* Selected — green ring (active) */
    #card-active[aria-expanded="true"] {
      background: var(--green-dim);
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green-ring), 0 0 24px var(--green-glow);
      transform: none;
    }

    #card-active[aria-expanded="true"] .stat-num   { color: var(--green); }
    #card-active[aria-expanded="true"] .stat-label { color: var(--green); opacity: 0.6; }
    #card-active[aria-expanded="true"] .stat-arrow { color: var(--green); opacity: 0.7; }

    /* Selected — amber ring (quiet) */
    #card-quiet[aria-expanded="true"] {
      background: var(--amber-dim);
      border-color: var(--amber);
      box-shadow: 0 0 0 1px var(--amber-ring), 0 0 24px var(--amber-glow);
      transform: none;
    }

    #card-quiet[aria-expanded="true"] .stat-num   { color: var(--amber); }
    #card-quiet[aria-expanded="true"] .stat-label { color: var(--amber); opacity: 0.6; }
    #card-quiet[aria-expanded="true"] .stat-arrow { color: var(--amber); opacity: 0.7; }

    /* Selected — red ring (failing) */
    #card-failing[aria-expanded="true"] {
      background: var(--red-dim);
      border-color: var(--red);
      box-shadow: 0 0 0 1px var(--red-ring), 0 0 24px var(--red-glow);
      transform: none;
    }

    #card-failing[aria-expanded="true"] .stat-num   { color: var(--red); }
    #card-failing[aria-expanded="true"] .stat-label { color: var(--red); opacity: 0.6; }
    #card-failing[aria-expanded="true"] .stat-arrow { color: var(--red); opacity: 0.7; }

    .stat-num {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--text-hi);
      transition: color 0.15s var(--ease);
    }

    .stat-num.amber { color: var(--amber); }
    .stat-num.red   { color: var(--red); }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.15s var(--ease);
    }

    .stat-arrow {
      position: absolute;
      top: 16px;
      right: 14px;
      font-size: 12px;
      color: var(--text-muted);
      pointer-events: none;
      transition: transform 0.3s var(--ease), color 0.15s var(--ease);
    }

    #card-active[aria-expanded="true"]  .stat-arrow,
    #card-quiet[aria-expanded="true"]   .stat-arrow,
    #card-failing[aria-expanded="true"] .stat-arrow { transform: rotate(180deg); }

    /* ── Panels — CSS grid accordion ────────────────────────────────────── */
    .panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s var(--ease);
    }

    .panel.open { grid-template-rows: 1fr; }

    .panel-inner { overflow: hidden; }

    .panel-content {
      margin-top: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      max-height: 540px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-hi) transparent;
    }

    .panel-content::-webkit-scrollbar { width: 3px; }
    .panel-content::-webkit-scrollbar-thumb { background: var(--border-hi); }

    /* ── Site rows ──────────────────────────────────────────────────────── */
    .site-row {
      display: flex;
      align-items: center;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.1s ease;
      border-left: 2px solid transparent;
      opacity: 0;
    }

    .site-row:last-of-type { border-bottom: none; }

    .site-row:hover { background: var(--surface2); }

    #panel-active  .site-row:hover { border-left-color: var(--green); }
    #panel-quiet   .site-row:hover { border-left-color: var(--amber); }
    #panel-failing .site-row:hover { border-left-color: var(--red); }

    .panel-entering .site-row {
      animation: rowIn 0.32s var(--ease) calc(var(--i, 0) * 50ms) both;
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-4px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .site-prefix {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
      user-select: none;
    }

    #panel-active  .site-row:hover .site-prefix { color: var(--green); }
    #panel-quiet   .site-row:hover .site-prefix { color: var(--amber); }
    #panel-failing .site-row:hover .site-prefix { color: var(--red); }

    .site-name {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .site-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Proportional bar */
    .bar-wrap { display: flex; align-items: center; gap: 8px; }

    .bar-track {
      width: 70px;
      height: 2px;
      background: var(--surface3);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      box-shadow: 0 0 4px rgba(74,246,38,0.5);
      transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .count-val {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      min-width: 20px;
      text-align: right;
    }

    /* Badges */
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-amber {
      color: var(--amber);
      background: var(--amber-dim);
      border: 1px solid rgba(255,149,0,0.3);
    }

    .badge-red {
      color: var(--red);
      background: var(--red-dim);
      border: 1px solid rgba(255,59,48,0.3);
    }

    .last-date {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 12px;
      transition: transform 0.15s var(--ease), color 0.1s ease;
    }

    #panel-active  .site-row:hover .chevron { transform: translateX(2px); color: var(--green); }
    #panel-quiet   .site-row:hover .chevron { transform: translateX(2px); color: var(--amber); }
    #panel-failing .site-row:hover .chevron { transform: translateX(2px); color: var(--red); }

    /* Panel footer */
    .panel-footer {
      padding: 9px 16px;
      font-size: 10px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Page footer ────────────────────────────────────────────────────── */
    .page-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 24px 0 52px;
      margin-top: 32px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Backdrop ───────────────────────────────────────────────────────── */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 40;
    }

    .backdrop.visible { opacity: 1; pointer-events: auto; }

    /* ── Drawer ─────────────────────────────────────────────────────────── */
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(480px, 94vw);
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.38s var(--ease-drawer);
      display: flex;
      flex-direction: column;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-hd {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-shrink: 0;
    }

    .drawer-eyebrow {
      font-size: 9px;
      color: var(--green);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .drawer-eyebrow.red { color: var(--red); }

    .drawer-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-hi);
      line-height: 1.2;
      text-transform: uppercase;
    }

    .drawer-domain {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 5px;
      letter-spacing: 0.06em;
      transition: color 0.1s ease;
    }

    .drawer-domain:hover { color: var(--text-dim); }

    .drawer-close {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 14px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.1s ease, color 0.1s ease, box-shadow 0.1s ease;
    }

    .drawer-close:hover {
      border-color: var(--border-hi);
      color: var(--text);
      box-shadow: 0 0 8px rgba(74,246,38,0.1);
    }

    .drawer-stats {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .d-stat {
      flex: 1;
      padding: 14px 22px;
      border-right: 1px solid var(--border);
    }

    .d-stat:last-child { border-right: none; }

    .d-stat-label {
      font-size: 9px;
      color: #888888;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .d-stat-num {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--text-hi);
    }

    .d-stat-num.green { color: var(--green); }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-hi) transparent;
    }

    .drawer-body::-webkit-scrollbar { width: 3px; }
    .drawer-body::-webkit-scrollbar-thumb { background: var(--border-hi); }

    .links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .link-item { opacity: 0; }

    .link-item.show { animation: linkIn 0.25s var(--ease) both; }

    @keyframes linkIn {
      from { opacity: 0; transform: translateX(-4px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .link-item a {
      display: block;
      padding: 8px 10px;
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    .link-item a:hover {
      background: var(--surface2);
      border-left-color: var(--green);
    }

    .link-prefix {
      font-size: 10px;
      color: var(--text-muted);
      user-select: none;
    }

    .link-item a:hover .link-prefix { color: var(--green); }

    .link-slug {
      font-size: 12px;
      color: var(--text);
      line-height: 1.4;
      word-break: break-word;
    }

    .link-url {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
      word-break: break-all;
      letter-spacing: 0.02em;
    }

    .no-links {
      padding: 20px 10px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    /* ── Week groups (drawer) ───────────────────────────────────────────── */
    .week-group { margin-bottom: 2px; }

    .week-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px 7px;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888888;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }

    .week-header.current {
      color: var(--green);
      border-bottom-color: rgba(74,246,38,0.2);
    }

    .week-count {
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
    }

    /* This-week links — persistent green left accent + subtle tint */
    .fresh-link a {
      background: rgba(74,246,38,0.03);
      border-left-color: rgba(74,246,38,0.35);
    }

    .fresh-link a:hover {
      background: rgba(74,246,38,0.07);
      border-left-color: var(--green);
    }

    .fresh-link .link-slug   { color: var(--text-hi); }
    .fresh-link .link-prefix { color: rgba(74,246,38,0.45); }
    .fresh-link a:hover .link-prefix { color: var(--green); }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .header { flex-direction: column; gap: 12px; padding: 36px 0 24px; }
      .header-right { text-align: left; }
      .bar-track { width: 48px; }
      .spark-bars { height: 36px; }
      .spark-total { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, .panel, .drawer, .stat-card, .cursor, .status-dot, .spark-fill
        { transition: none !important; animation: none !important; }
      .site-row  { opacity: 1 !important; }
      .link-item { opacity: 1 !important; }
      .spark-fill { height: var(--h, 0%) !important; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Loading -->
  <div id="view-loading">

  </div>

<!-- Drawer overlay -->

        <svg width="9" height="9" viewBox="0 0 10 10" fill="none">
          <path d="M3.5 2H2C1.45 2 1 2.45 1 3V8C1 8.55 1.45 9 2 9H7C7.55 9 8 8.55 8 8V6.5M6 1H9M9 1V4M9 1L4.5 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

<script>
/* ── Constants ─────────────────────────────────────────────────────────────── */
const STALE_DAYS = 7;
const SKIP_TYPES = new Set(["skip", "html_TODO"]);
const REFRESH_MS = 15 * 60 * 1000;
let   lastUpdatedAt = null;
let   lastSevenDay  = {};

/* ── Utilities ─────────────────────────────────────────────────────────────── */
function daysSince(iso) {
  if (!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso)) / 86_400_000);
}

function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function fmtIso(iso) {
  if (!iso) return "";
  return new Date(iso).toISOString().slice(0, 16).replace("T", " ") + "Z";
}

function relTime(iso) {
  const d = daysSince(iso);
  if (!isFinite(d)) return "";
  if (d === 0) return "Today";
  if (d === 1) return "Yesterday";
  if (d < 30)  return `${d}D Ago`;
  return fmtDate(iso);
}

function urlToSlug(href) {
  try {
    const parts = new URL(href).pathname.split("/").filter(Boolean);
    const slug  = parts[parts.length - 1] || href;
    return slug.replace(/-|_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  } catch { return href; }
}

function esc(s) { return String(s).replace(/"/g, "&quot;"); }

/* ── Load & derive ─────────────────────────────────────────────────────────── */
async function loadData(bust = false) {
  const url = bust ? `/api/data?bust=${Date.now()}` : "/api/data";
  const res = await fetch(url, bust ? { cache: "no-store" } : {});
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `HTTP ${res.status}`);
  }
  return res.json();
}

function derive({ config, state, lastActive, updatedAt }) {
  const cutoff    = new Date(Date.now() - STALE_DAYS * 86_400_000);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  const failing   = new Set(lastActive._currently_failing || []);
  const sevenDay  = lastActive._seven_day_counts || {};
  const sites     = (config.sites || []).filter(s => !SKIP_TYPES.has(s.type));
  const activeSites = [], quietSites = [];

  for (const site of sites) {
    const name  = site.name;
    const week7 = Object.entries(sevenDay[name] || {})
      .filter(([d]) => d >= cutoffStr)
      .reduce((sum, [, v]) => sum + v, 0);
    const lastTs = lastActive[name];
    const days   = daysSince(lastTs);

    if (week7 > 0) {
      activeSites.push({ name, url: site.url, count: week7 });
    } else if (!failing.has(name) && lastTs && days >= STALE_DAYS) {
      quietSites.push({ name, url: site.url, lastActive: lastTs, days });
    }
  }

  activeSites.sort((a, b) => b.count - a.count);
  quietSites.sort((a, b) => b.days - a.days);

  const failingSites = [...failing].map(name => {
    const site = sites.find(s => s.name === name);
    return site ? { name, url: site.url } : null;
  }).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));

  const weekTotal = activeSites.reduce((s, x) => s + x.count, 0);

  // Build 7-day daily totals for sparkline
  const sparkDays = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86_400_000).toISOString().slice(0, 10);
    sparkDays.push(d);
  }
  const sparkData = sparkDays.map(date => ({
    date,
    count: sites.reduce((sum, s) => sum + (sevenDay[s.name]?.[date] || 0), 0),
  }));

  return { sites, activeSites, quietSites, failingSites, weekTotal, sparkData, state, sevenDay, updatedAt };
}

/* ── Render panels ─────────────────────────────────────────────────────────── */
function renderActive(sites, state) {
  const max = sites[0]?.count || 1;
  const el  = document.getElementById("content-active");
  el.innerHTML = sites.map((s, i) => {
    const pct = Math.round((s.count / max) * 100);
    return `<div class="site-row" data-name="${esc(s.name)}" style="--i:${Math.min(i, 9)}">
      <span class="site-prefix">&gt;</span>
      <span class="site-name">${s.name}</span>
      <div class="site-meta">
        <div class="bar-wrap">
          <div class="bar-track"><div class="bar-fill" data-w="${pct}%"></div></div>
          <span class="count-val">${s.count}</span>
        </div>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }).join("") + (sites.length > 12
    ? `<div class="panel-footer">// ${sites.length} Sources Total</div>` : "");
  el.querySelectorAll(".site-row").forEach(row =>
    row.addEventListener("click", () => openDrawer(row.dataset.name, sites, state))
  );
}

function renderQuiet(sites, state) {
  const el = document.getElementById("content-quiet");
  el.innerHTML = sites.map((s, i) => {
    const cls = s.days >= 14 ? "badge-red" : "badge-amber";
    return `<div class="site-row" data-name="${esc(s.name)}" style="--i:${Math.min(i, 9)}">
      <span class="site-prefix">&gt;</span>
      <span class="site-name">${s.name}</span>
      <div class="site-meta">
        <span class="last-date">${fmtDate(s.lastActive)}</span>
        <span class="badge ${cls}">${s.days}D Quiet</span>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }).join("") + (sites.length > 8
    ? `<div class="panel-footer">// ${sites.length} Quiet Sites Total</div>` : "");
  el.querySelectorAll(".site-row").forEach(row =>
    row.addEventListener("click", () => openDrawer(row.dataset.name, sites, state))
  );
}

function renderFailing(sites, state) {
  const el = document.getElementById("content-failing");
  if (sites.length === 0) {
    el.innerHTML = `<div class="panel-footer">// No scraper errors detected</div>`;
    return;
  }
  el.innerHTML = sites.map((s, i) =>
    `<div class="site-row" data-name="${esc(s.name)}" style="--i:${Math.min(i, 9)}">
      <span class="site-prefix">&gt;</span>
      <span class="site-name">${s.name}</span>
      <div class="site-meta">
        <span class="badge badge-red">Scraper Err</span>
        <span class="chevron">›</span>
      </div>
    </div>`
  ).join("") + (sites.length > 12
    ? `<div class="panel-footer">// ${sites.length} Errors Total</div>` : "");
  el.querySelectorAll(".site-row").forEach(row =>
    row.addEventListener("click", () => openDrawer(row.dataset.name, sites, state, true))
  );
}

/* ── Sparkline ─────────────────────────────────────────────────────────────── */
function renderSparkline(sparkData) {
  const el    = document.getElementById("spark-bars");
  const max   = Math.max(...sparkData.map(d => d.count), 1);
  const total = sparkData.reduce((s, d) => s + d.count, 0);

  el.innerHTML = sparkData.map((d, i) => {
    const pct  = Math.round((d.count / max) * 100);
    const dt   = new Date(d.date + "T12:00:00Z");
    const day  = dt.toLocaleDateString("en-US", { weekday: "short" }).slice(0, 2);
    const tip  = dt.toLocaleDateString("en-US", { month: "short", day: "2-digit" })
                 + " · " + d.count + (d.count === 1 ? " link" : " links");
    const cls  = d.count > 0 ? " has-data" : "";
    return `<div class="spark-col" data-tip="${tip}">
      <div class="spark-bar-wrap">
        <div class="spark-fill${cls}" data-h="${pct}%" style="transition-delay:${i * 55}ms"></div>
      </div>
      <div class="spark-day">${day}</div>
    </div>`;
  }).join("");

  document.getElementById("spark-total").textContent =
    total > 0 ? `${total.toLocaleString()} links` : "—";

  // Animate bars after layout settles
  requestAnimationFrame(() =>
    setTimeout(() =>
      el.querySelectorAll(".spark-fill").forEach(b => b.style.height = b.dataset.h),
      80
    )
  );
}

/* ── Panel toggle ──────────────────────────────────────────────────────────── */
const ALL_PANELS = ["panel-active", "panel-quiet", "panel-failing"];
const ALL_CARDS  = ["card-active",  "card-quiet",  "card-failing"];

function togglePanel(cardId, panelId) {
  const card   = document.getElementById(cardId);
  const panel  = document.getElementById(panelId);
  const isOpen = panel.classList.contains("open");

  ALL_PANELS.forEach(id => {
    const p = document.getElementById(id);
    p.classList.remove("open");
    setTimeout(() => p.querySelectorAll(".bar-fill").forEach(b => b.style.width = "0%"), 420);
  });
  ALL_CARDS.forEach(id =>
    document.getElementById(id).setAttribute("aria-expanded", "false")
  );

  if (!isOpen) {
    panel.classList.add("open");
    card.setAttribute("aria-expanded", "true");

    const content = panel.querySelector(".panel-content");
    content.classList.remove("panel-entering");
    void content.offsetHeight;
    content.classList.add("panel-entering");

    setTimeout(() =>
      panel.querySelectorAll(".bar-fill").forEach(b => b.style.width = b.dataset.w),
      130
    );
    setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 65);
  }
}

/* ── Link date assignment & grouping ───────────────────────────────────────── */
function assignLinkDates(name, links) {
  // links are newest-first; _seven_day_counts gives per-day counts newest→oldest
  // Map daily counts onto the URL list to infer approximate dates.
  const counts = lastSevenDay[name] || {};
  const dates  = Object.keys(counts).sort().reverse(); // newest date first
  const result = [];
  let   idx    = 0;

  for (const date of dates) {
    for (let i = 0; i < counts[date] && idx < links.length; i++, idx++) {
      result.push({ href: links[idx], date });
    }
  }
  while (idx < links.length) {
    result.push({ href: links[idx++], date: null });
  }
  return result;
}

function groupLinksByWeek(datedLinks) {
  const d7  = new Date(Date.now() -  7 * 86_400_000).toISOString().slice(0, 10);
  const d14 = new Date(Date.now() - 14 * 86_400_000).toISOString().slice(0, 10);
  const groups = { thisWeek: [], lastWeek: [], older: [] };
  for (const item of datedLinks) {
    if (item.date && item.date >= d7)       groups.thisWeek.push(item);
    else if (item.date && item.date >= d14) groups.lastWeek.push(item);
    else                                    groups.older.push(item);
  }
  return groups;
}

function renderGroupedLinks(links, name) {
  const container = document.getElementById("links-list");

  if (links.length === 0) {
    container.innerHTML = `<div class="no-links">// No links captured yet.</div>`;
    return;
  }

  const { thisWeek, lastWeek, older } = groupLinksByWeek(assignLinkDates(name, links));

  const GROUPS = [
    { label: "This Week",  items: thisWeek, hdrCls: "current", itemCls: "fresh-link" },
    { label: "Last Week",  items: lastWeek, hdrCls: "",         itemCls: "" },
    { label: "Older",      items: older,    hdrCls: "",         itemCls: "" },
  ].filter(g => g.items.length > 0);

  let delay = 0;
  container.innerHTML = GROUPS.map(g => {
    const rows = g.items.map(item => {
      const d = Math.min(delay++ * 28, 420);
      return `<li class="link-item ${g.itemCls}" style="animation-delay:${d}ms">
        <a href="${esc(item.href)}" target="_blank" rel="noopener noreferrer">
          <div><span class="link-prefix">&rarr; </span><span class="link-slug">${urlToSlug(item.href)}</span></div>
          <div class="link-url">${item.href}</div>
        </a>
      </li>`;
    }).join("");

    const n = g.items.length;
    return `<div class="week-group">
      <div class="week-header ${g.hdrCls}">
        <span>// ${g.label}</span>
        <span class="week-count">${n} link${n !== 1 ? "s" : ""}</span>
      </div>
      <ul class="links-list">${rows}</ul>
    </div>`;
  }).join("");

  requestAnimationFrame(() =>
    container.querySelectorAll(".link-item").forEach(li => li.classList.add("show"))
  );
}

/* ── Drawer ────────────────────────────────────────────────────────────────── */
function openDrawer(name, sites, state, isFailing = false) {
  const site  = sites.find(s => s.name === name);
  const links = (state[name] || []).slice().reverse();

  const eyebrow = document.getElementById("drawer-eyebrow");
  eyebrow.textContent = isFailing ? "// Scraper Error — Historical Intel" : "// Source Intel";
  eyebrow.classList.toggle("red", isFailing);

  document.getElementById("drawer-name").textContent = name;

  const domainEl  = document.getElementById("drawer-domain");
  const domainTxt = document.getElementById("drawer-domain-txt");
  if (site?.url) {
    try {
      domainTxt.textContent = new URL(site.url).hostname;
      domainEl.href = site.url;
    } catch { domainTxt.textContent = ""; }
  } else {
    domainTxt.textContent = "";
  }

  document.getElementById("d-total").textContent = links.length.toLocaleString();
  document.getElementById("d-week").textContent  = site?.count ? site.count : "—";

  renderGroupedLinks(links, name);

  document.getElementById("drawer").classList.add("open");
  document.getElementById("backdrop").classList.add("visible");
  document.body.style.overflow = "hidden";
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("backdrop").classList.remove("visible");
  document.body.style.overflow = "";
  setTimeout(() =>
    document.querySelectorAll(".link-item").forEach(li => li.classList.remove("show")),
    420
  );
}

/* ── Update dashboard ──────────────────────────────────────────────────────── */
function updateDashboard({ sites, activeSites, quietSites, failingSites, weekTotal, sparkData, state, sevenDay, updatedAt }) {
  lastSevenDay = sevenDay;
  document.getElementById("hdr-total").textContent   = sites.length;
  document.getElementById("num-active").textContent  = activeSites.length;
  document.getElementById("num-quiet").textContent   = quietSites.length;
  document.getElementById("num-failing").textContent = failingSites.length;
  document.getElementById("num-links").textContent   = weekTotal.toLocaleString();
  document.getElementById("hdr-updated").textContent = updatedAt ? `Sync: ${relTime(updatedAt)}` : "";
  document.getElementById("footer-date").textContent = updatedAt ? fmtIso(updatedAt) : "";
  renderActive(activeSites, state);
  renderQuiet(quietSites, state);
  renderFailing(failingSites, state);
  renderSparkline(sparkData);
}

function flashUpdated(updatedAt) {
  const el   = document.getElementById("hdr-updated");
  const next = updatedAt ? `Sync: ${relTime(updatedAt)}` : "";
  el.textContent = "[ Sync Complete ]";
  el.style.color = "var(--green)";
  setTimeout(() => { el.textContent = next; el.style.color = ""; }, 2400);
}

function resetUI() {
  closeDrawer();
  ALL_PANELS.forEach(id => {
    const p = document.getElementById(id);
    p.classList.remove("open");
    p.querySelectorAll(".bar-fill").forEach(b => b.style.width = "0%");
  });
  ALL_CARDS.forEach(id =>
    document.getElementById(id).setAttribute("aria-expanded", "false")
  );
  // Reset sparkline bars
  document.querySelectorAll(".spark-fill").forEach(b => b.style.height = "0%");
}

/* ── Background / manual refresh ──────────────────────────────────────────── */
async function refreshData(force = false) {
  const btn = document.getElementById("btn-refresh");
  if (btn) { btn.disabled = true; btn.textContent = "[ Syncing... ]"; }
  try {
    const raw = await loadData(force);
    if (!force && raw.updatedAt === lastUpdatedAt) return;
    lastUpdatedAt = raw.updatedAt;
    resetUI();
    updateDashboard(derive(raw));
    flashUpdated(raw.updatedAt);
  } catch (err) {
    console.warn("Refresh failed:", err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "[ Refresh ]"; }
  }
}

/* ── Init ──────────────────────────────────────────────────────────────────── */
async function init() {
  try {
    const raw = await loadData();
    lastUpdatedAt = raw.updatedAt;
    updateDashboard(derive(raw));

    document.getElementById("card-active")
      .addEventListener("click", () => togglePanel("card-active", "panel-active"));
    document.getElementById("card-quiet")
      .addEventListener("click", () => togglePanel("card-quiet", "panel-quiet"));
    document.getElementById("card-failing")
      .addEventListener("click", () => togglePanel("card-failing", "panel-failing"));
    document.getElementById("drawer-close").addEventListener("click", closeDrawer);
    document.getElementById("backdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

    document.getElementById("view-loading").style.display = "none";
    document.getElementById("view-dashboard").style.display = "block";

    setInterval(refreshData, REFRESH_MS);

  } catch (err) {
    document.getElementById("view-loading").style.display = "none";
    document.getElementById("err-msg").textContent = err.message;
    document.getElementById("view-error").style.display = "flex";
  }
}

init();
</script>
</body>
</html>

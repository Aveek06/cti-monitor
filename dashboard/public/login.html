<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTI Monitor — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;600;700&display=swap">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#020202;--surface:#080808;--surface2:#0e0e0e;--border:#1c1c1c;--border-hi:#2e2e2e;
      --text:#d0d0d0;--text-hi:#f4f4f4;--text-dim:#808080;--text-muted:#484848;
      --green:#00ff41;--green-dim:rgba(0,255,65,.07);--green-glow:rgba(0,255,65,.18);
      --amber:#ff9500;--red:#ff3b30;--cyan:#00d4ff;
      --font-mono:'Fira Code','JetBrains Mono',ui-monospace,monospace;
      --font-ui:'Fira Sans',system-ui,sans-serif;
      --ease:cubic-bezier(.23,1,.32,1);
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-mono);}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}

    /* Grid background */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:linear-gradient(rgba(0,255,65,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.03) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;z-index:0;
    }

    .card{
      position:relative;z-index:1;
      width:100%;max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
      border-top:2px solid var(--green);
      padding:36px 32px 32px;
    }

    .logo{
      display:flex;align-items:center;gap:10px;
      margin-bottom:28px;
    }
    .logo-icon{
      width:32px;height:32px;border:1px solid var(--green);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 12px var(--green-glow);
    }
    .logo-icon svg{width:18px;height:18px;color:var(--green);}
    .logo-text{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--text-hi);}
    .logo-sub{font-size:8px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-top:2px;font-family:var(--font-ui);}

    h1{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-bottom:22px;font-family:var(--font-ui);display:flex;align-items:center;gap:8px;}
    h1::before{content:'';display:block;width:12px;height:1px;background:var(--green);box-shadow:0 0 4px var(--green);}

    .field{margin-bottom:14px;}
    label{display:block;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;font-family:var(--font-ui);}
    input{
      width:100%;padding:10px 12px;
      background:var(--surface2);border:1px solid var(--border);
      color:var(--text-hi);font-family:var(--font-mono);font-size:12px;
      outline:none;transition:border-color .15s;
    }
    input::placeholder{color:var(--text-muted);}
    input:focus{border-color:var(--green);}

    .submit{
      width:100%;margin-top:20px;padding:11px;
      background:transparent;border:1px solid var(--green);
      color:var(--green);font-family:var(--font-mono);font-size:11px;font-weight:700;
      letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
      transition:background .15s,color .15s,box-shadow .15s;
    }
    .submit:hover{background:var(--green);color:#000;box-shadow:0 0 18px var(--green-glow);}
    .submit:active{transform:scale(.98);}
    .submit:disabled{opacity:.4;cursor:not-allowed;}

    .error{
      margin-top:14px;padding:9px 12px;
      border-left:2px solid var(--red);background:rgba(255,59,48,.07);
      font-size:10px;color:var(--red);display:none;
    }

    .footer{margin-top:20px;font-size:8px;color:var(--text-muted);text-align:center;letter-spacing:.06em;}
    .scan-line{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.15;animation:scan 4s linear infinite;}
    @keyframes scan{from{top:0}to{top:100vh}}
  </style>
</head>
<body>
  <div class="scan-line"></div>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">CTI Monitor</div>
        <div class="logo-sub">Threat Intelligence Platform</div>
      </div>
    </div>

    <h1>Analyst Sign In</h1>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="analyst@company.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••••••" required autocomplete="current-password">
      </div>
      <button class="submit" type="submit" id="submit-btn">[ AUTHENTICATE ]</button>
      <div class="error" id="error-msg"></div>
    </form>

    <div class="footer">Access is restricted to authorised analysts only.</div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '[ AUTHENTICATING... ]';

      try {
        const res = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication failed');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '[ AUTHENTICATE ]';
      }
    }
  </script>
</body>
</html>
